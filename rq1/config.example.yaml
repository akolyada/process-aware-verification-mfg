# Copy to rq1/config.yaml (git-ignored). Pin exact versions and report them in the paper.
# Ollama tags are mutable: record the digest (`ollama list` / `ollama show --modelfile`).
models:
  - name: local-a
    kind: openai_compatible
    base_url: http://localhost:11434/v1     # e.g. Ollama
    model: TODO-pinned-local-model-tag      # e.g. qwen3:8b (digest recorded automatically)
    temperature: 0.0
    no_think: true                          # reasoning models: reasoning_effort="none"
    structured_output: plan                 # constrained JSON (plan schema) for every planner
  - name: local-b
    kind: openai_compatible
    base_url: http://localhost:11434/v1
    model: TODO-second-local-model-tag
    temperature: 0.0
    structured_output: plan
  - name: api-a
    kind: anthropic
    model: TODO-pinned-api-model-id          # needs ANTHROPIC_API_KEY
    temperature: 0.0
# D2 (LLM-as-verifier): one fixed judge model for all planners, so D2 is comparable.
verifier:
  name: judge
  kind: openai_compatible
  base_url: http://localhost:11434/v1
  model: TODO-judge-model-tag
  temperature: 0.0
  structured_output: decision
verifier_conditions: [plain]   # D2 is an output filter: evaluated on the undefended prompt
n_per_cell: 100          # per model x condition x class (C1-C6 + benign); spec §7.3
seed: 424242             # trial generation; identical trials for every model/condition
conditions: [plain, d1_hardened, d4a_channel_separation]
# Channel (4 untrusted slots) and delivery style (direct / authority) are balanced
# by cycling within each class, not crossed: calls = models x conditions x 7 x n.
